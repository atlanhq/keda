name: Build Custom KEDA Image

on:
  push:
    branches:
    - 2.21.0-main
    - '*/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/2.21.0-main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: $GITHUB_ACTOR
          password: ${{ secrets.ORG_PAT_GITHUB }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Derive branch tag
        id: branch_tag
        run: echo "value=$(printf '%s' "$GITHUB_REF_NAME" | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/atlanhq/keda:2.21.0-main-${{ github.sha }}
            ghcr.io/atlanhq/keda:${{ steps.branch_tag.outputs.value }}-${{ github.sha }}

      # The metrics adapter and admission webhooks ship from this fork too, so the webhook
      # carries the fork's verifyName change and all three images share one commit.
      - name: Build and push metrics apiserver
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.adapter
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/atlanhq/keda-metrics-apiserver:2.21.0-main-${{ github.sha }}
            ghcr.io/atlanhq/keda-metrics-apiserver:${{ steps.branch_tag.outputs.value }}-${{ github.sha }}

      - name: Build and push admission webhooks
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.webhooks
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/atlanhq/keda-admission-webhooks:2.21.0-main-${{ github.sha }}
            ghcr.io/atlanhq/keda-admission-webhooks:${{ steps.branch_tag.outputs.value }}-${{ github.sha }}
